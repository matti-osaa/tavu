<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tavu – Tyypät hyökkäävät!</title>
<meta name="description" content="Tavu – Tyypät hyökkäävät! Opi kyrillisiä, kreikkalaisia ja katakanakirjaimia sekä ruotsin ja englannin sanoja ampumalla.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Pixelify+Sans:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@800;900&display=swap">
<link rel="stylesheet" href="css/base.css?v=20261018k">
<link rel="stylesheet" href="css/cipher.css?v=20261018k">
<link rel="stylesheet" href="css/seasons/halloween.css?v=20261018k">
</head>
<body>
<section id="map" class="screen">
  <button class="menu-btn" id="menuBtn" aria-label="Valikko" aria-expanded="false" aria-controls="menuPanel"><i></i><i></i><i></i></button>
  <div class="menu-panel" id="menuPanel" hidden>
    <div class="menu-head"><span>Asetukset</span><button class="menu-close" id="menuClose" aria-label="Sulje valikko">✕</button></div>
    <div class="menu-row">
      <div class="menu-label">Kirjaimet</div>
      <div class="seg" id="caseSeg" role="radiogroup" aria-label="Kirjainkoko">
      <button data-m="upper" role="radio">Isot</button><button data-m="lower" role="radio">Pienet</button><button data-m="mixed" role="radio">Sekaisin</button><button data-m="pair" role="radio">Rinnakkain</button>
    </div>
    </div>
    <button class="btn alt" id="tutBtn">Harjoittele alusta</button>
  </div>
  <div class="map-inner">
    <header class="brand">
      <div class="logo" aria-label="Tavu" title="Т kyrillinen, Α kreikkalainen, V ja U latinalaiset"><span>Т</span><span>Α</span><span>V</span><span>U</span></div>
      <div class="slogan">Tyypät hyökkäävät!</div>
      <div class="tag">Opi vieraita kirjoitusjärjestelmiä ja kieliä taistelemalla tiesi läpi!</div>
    </header>
    <div class="seg" id="diffSeg" role="radiogroup" aria-label="Vaikeustaso">
      <button data-m="easy" role="radio">Helppo</button><button data-m="normal" role="radio">Normaali</button><button data-m="hard" role="radio">Vaikea</button>
    </div>
    <div id="worlds"></div>
  </div>
</section>

<section id="game" class="screen" hidden>
  <div class="hud">
    <button class="chip" id="back" aria-label="Takaisin kartalle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="chip hearts" id="hearts"></div>
    <div class="prog" aria-label="Edistyminen"><b id="progbar"></b></div>
    <button class="chip" id="snd" aria-label="Ääni päälle tai pois"></button>
  </div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div id="ov"></div></div>
  <div class="ammo" id="ammo"></div>
</section>

<section id="cipher" class="screen" hidden></section>

<!-- Core: registry first, then content packs register themselves -->
<script src="js/core/registry.js?v=20261018k"></script>
<script src="js/render/draw-utils.js?v=20261018k"></script>

<!-- Worlds (map order = script order). Add a language: new file in js/worlds/ + one line here. -->
<script src="js/worlds/cyrillic.js?v=20261018k"></script>
<script src="js/worlds/greek.js?v=20261018k"></script>
<script src="js/worlds/katakana.js?v=20261018k"></script>
<script src="js/worlds/swedish.js?v=20261018k"></script>
<script src="js/worlds/english.js?v=20261018k"></script>

<!-- Seasons: switch on automatically by date. Add one: js/seasons/<id>.js + css/seasons/<id>.css -->
<script src="js/seasons/halloween.js?v=20261018k"></script>
<script src="js/seasons/halloween-map.js?v=20261018k"></script>

<script src="js/core/storage.js?v=20261018k"></script>
<script src="js/core/settings.js?v=20261018k"></script>
<script src="js/core/audio.js?v=20261018k"></script>
<script src="js/game/view.js?v=20261018k"></script>
<script src="js/ui/alphabet.js?v=20261018k"></script>
<script src="js/ui/map.js?v=20261018k"></script>
<script src="js/game/game.js?v=20261018k"></script>
<script src="js/content/sentences-fi.js?v=20261018k"></script>
<script src="js/game/cipher.js?v=20261018k"></script>
<script src="js/render/scene.js?v=20261018k"></script>
<script src="js/render/actors.js?v=20261018k"></script>
<script src="js/render/frame.js?v=20261018k"></script>
<script src="js/game/input.js?v=20261018k"></script>
<script src="js/main.js?v=20261018k"></script>
</body>
</html>
